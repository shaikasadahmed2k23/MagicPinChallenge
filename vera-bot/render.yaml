services:
  - type: web
    name: vera-challenge-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: TEAM_NAME
        value: "Asad Solo"
      - key: TEAM_MEMBERS
        value: "Shaik Asad Ahmed"
      - key: CONTACT_EMAIL
        sync: false
